name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Tests use a fake reveal.js folder (tests/conftest.py): no download,
      # neither heig/bootstrap.sh nor revelation installreveal.
      - name: Tests (pytest)
        env:
          BROWSER: "true"
        run: uv run --locked --python ${{ matrix.python-version }} --group dev pytest

      - name: uv.lock and requirements.txt up to date
        if: matrix.python-version == '3.11'
        run: |
          uv lock --check
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o requirements.txt
          git diff --exit-code requirements.txt
