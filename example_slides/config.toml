# Revelation presentation configuration (TOML format)
# This is the secure, recommended format for revelation configurations

# Presentation metadata
[reveal_meta]
title = "Intro unité"
author = "Adrien Gressin"
description = "Imaphoto - introduction de l'unité"

# Slide separators
reveal_slide_separator = "---"
reveal_vertical_slide_separator = "--"

# Theme selection
# Available themes: beige, black, blood, league, moon, night, serif, simple, sky, solarized, white
reveal_theme = "heig_ec+g"

# Logo selection (custom)
# Options: ggt, master
reveal_theme_logo = "ggt"

# Creative Commons License
# Options: by, by-nd, by-sa, by-nc, by-nc-nd, by-nc-sa
# See: https://creativecommons.org/choose/
reveal_licence = "by-sa"

# Template file to use
# myPresentation.html (default, reveal.js 5.x) or a specialized template
# from revelation/templates/ (e.g. presentation_lidar.html)
reveal_template = "myPresentation.html"

# Reveal.js configuration options
[reveal_config]
width = 2056
height = 1440

# Display controls in the bottom right corner
controls = true

# Display a presentation progress bar
progress = true

# Display the page number of the current slide
slideNumber = "c/t"

# Push each slide change to the browser history
history = true

# Enable the slide overview mode
overview = true

# Vertical centering of slides
center = true

# Enables touch navigation on devices with touch input
touch = true

# Loop the presentation
loop = false

# Change the presentation direction to be RTL
rtl = false

# Turns fragments on and off globally
fragments = true

# Flags if the presentation is running in an embedded mode
embedded = false

# Flags if we should show a help overlay when the questionmark key is pressed
help = true

# Flags if speaker notes should be visible to all viewers
showNotes = false

# Number of milliseconds between automatically proceeding to the next slide
# Set to 0 to disable auto-slide
autoSlide = 0

# Stop auto-sliding after user input
autoSlideStoppable = true

# Enable slide navigation via mouse wheel
mouseWheel = false

# Hides the address bar on mobile devices
hideAddressBar = true

# Opens links in an iframe preview overlay
previewLinks = false

# Transition style
# Options: default, cube, page, concave, zoom, linear, fade, none
transition = "none"

# Transition speed
# Options: default, fast, slow
transitionSpeed = "default"

# Transition style for full page slide backgrounds
# Options: default, none, slide, concave, convex, zoom
backgroundTransition = "none"

# Number of slides away from the current that are visible
viewDistance = 3

# Parallax background image (leave empty to disable)
parallaxBackgroundImage = ""

# Parallax background size (CSS syntax, e.g. "2100px 900px")
parallaxBackgroundSize = ""

# Amount to move parallax background (horizontal and vertical) on slide change
parallaxBackgroundHorizontal = ""
parallaxBackgroundVertical = ""
