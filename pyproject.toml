[project]
name = "revelation"
version = "0.1.0"
description = "CLI tool for creating reveal.js presentations from markdown"
authors = [{ name = "Adrien Gressin", email = "adrien.gressin@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["presentation", "slides", "reveal.js", "markdown"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = [
    "jinja2>=3.1.4,<4",
    "werkzeug>=3.0.4,<4",
    "click>=8.1.7,<9",
    "gevent-websocket>=0.10.1,<0.11",
    "gevent>=24.2.1,<25",
    "watchdog>=5.0.2,<6",
    "tomli>=2.0.1,<3; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=4.1.0,<7",
]

[project.scripts]
revelation = "revelation.cli:cli"

[project.urls]
Homepage = "https://github.com/agressin/revelation"
Repository = "https://github.com/agressin/revelation"
Upstream = "https://github.com/humrochagf/revelation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["revelation"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["revelation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=revelation --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
